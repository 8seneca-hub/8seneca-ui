name: publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) — no NPM_TOKEN secret
    steps:
      - uses: actions/checkout@v4
      # No `version:` — packageManager in package.json pins pnpm, and
      # action-setup errors out if both are given.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm >= 11.5.1; setup-node ships npm 10
      # with Node 22, which publishes unauthenticated and gets a 404 on PUT.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter 8seneca-app-launcher test
      - run: npm publish --access public
        working-directory: packages/app-launcher
